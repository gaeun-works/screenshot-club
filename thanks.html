<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 신청 완료 · 마케터 스크린샷 털이 클럽</title>
<meta name="robots" content="noindex">
<script src="site.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* Same tokens as index.html */
  :root {
    --brand-yellow: #F6C348;
    --brand-yellow-deep: #C98A0A;
    --bg-cream: #FDF4E8;
    --bg-white: #FFFFFF;
    --text-primary: #2A2118;
    --text-secondary: #6E6253;
    --font-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    --font-hand: 'Nanum Pen Script', cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--text-primary); background: #EFE5D6; letter-spacing: -0.01em; line-height: 1.5; word-break: keep-all; }
  a { color: inherit; text-decoration: none; }
  .page {
    max-width: 480px; min-height: 100vh; margin: 0 auto; padding: 72px 24px 48px;
    background: linear-gradient(180deg, #FDF4E8 0%, #FFDDB9 100%);
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px;
  }
  h1 { font-family: var(--font-hand); font-size: 46px; font-weight: 400; line-height: 1.1; }
  .card { width: 100%; background: var(--bg-white); border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; gap: 16px; }
  .card p { font-size: 16px; line-height: 1.65; }
  .card .thanks { font-weight: 700; }
  .card .collect { color: var(--text-secondary); }
  .note { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .btn {
    display: flex; justify-content: center; align-items: center; width: 100%; padding: 18px 24px; border-radius: 14px;
    background: var(--brand-yellow); color: var(--text-primary); font-size: 17px; font-weight: 700;
  }
</style>
</head>
<body>
<main class="page">
  <h1>알림 신청 완료! 📸</h1>

  <div class="card">
    <p class="thanks">관심 가져주셔서 감사합니다.</p>
    <p>1기 오픈이 확정되면<br>남겨주신 이메일로 가장 먼저 알려드릴게요.</p>
    <p class="collect">그전까지 사진첩 속 좋은 카피들,<br>버리지 말고 조금만 더 모아두세요 :)</p>
  </div>

  <p class="note">알림 신청만으로 결제가 발생하지 않으며,<br>오픈 안내를 받은 뒤 참여 여부를 결정할 수 있습니다.</p>

  <a class="btn" href="index.html">상세페이지로 돌아가기</a>
</main>

<script>
  // Fire the conversion only when arriving from a successful submit on apply.html.
  // The flag is removed right away, so a refresh or a direct visit records nothing.
  const { ssGet, ssDel, track, pixel } = window.Site;
  if (ssGet('lead_pending') === '1') {
    ssDel('lead_pending');
    track('generate_lead');   // + utm_source / utm_campaign / utm_content (added in site.js)
    pixel('Lead');
  }
</script>
</body>
</html>
